<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SONINO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b5e30; /* Verde da mesa */
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* TELA DE MENU */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        h1 { color: #d4af37; font-size: 3.5rem; margin-bottom: 5px; text-shadow: 2px 2px 4px #000; }
        p { font-size: 1.2rem; margin-bottom: 30px; }
        .btn {
            background-color: #d4af37; color: #000; padding: 15px 40px;
            border: 2px solid #fff; border-radius: 10px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* TELA DO JOGO */
        #game-screen {
            display: none; /* Escondido no início */
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* Áreas da mesa */
        .area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 33%;
            gap: 10px;
        }

        .card {
            width: 70px;
            height: 105px;
            background-color: #f0f0f0;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #000;
            font-weight: bold;
            position: relative;
        }

        .card::before {
            content: "SONINO";
            position: absolute;
            font-size: 10px;
            color: #d4af37;
            top: 5px;
        }

        .card.back {
            background-color: #1a1a1a;
            border: 2px solid #d4af37;
            color: #d4af37;
        }
        
        .card.red { color: red; }

        .mesa-central {
            background-color: rgba(0,0,0,0.2);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 20px;
            gap: 20px;
        }

        .info-texto {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- TELA 1: MENU -->
    <div id="menu-screen">
        <h1>SONINO</h1>
        <p>Jogo de Cartas</p>
        <button class="btn" onclick="iniciarJogo()">JOGAR</button>
    </div>

    <!-- TELA 2: JOGO -->
    <div id="game-screen">
        <!-- Mão do Adversário (Android) -->
        <div class="area">
            <div class="card back"></div>
            <div class="card back"></div>
            <div class="card back"></div>
        </div>

        <!-- Mesa Central -->
        <div class="area">
            <div class="info-texto" style="position: absolute; top: 35%;">Trunfo: Paus ♣️</div>
            <div class="mesa-central">
                <div class="card" style="background-color: #1a1a1a; color: white;">7 ♠️</div>
                <div class="card red">K ♥️</div>
            </div>
        </div>

        <!-- Mão do Jogador -->
        <div class="area" style="align-items: flex-end; padding-bottom: 20px;">
            <div class="card red">A ♥️</div>
            <div class="card">10 ♣️</div>
            <div class="card red">Q ♦️</div>
        </div>
    </div>

    <script>
        function iniciarJogo() {
            // Esconde o menu
            document.getElementById('menu-screen').style.display = 'none';
            // Mostra a mesa de jogo
            document.getElementById('game-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
